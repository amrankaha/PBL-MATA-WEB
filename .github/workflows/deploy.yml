name: M.A.T.A CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Simulasi Deploy Sukses
        run: |
          echo "Simulasi deployment Proyek M.A.T.A berhasil dijalankan!"

      - name: Send Telegram Notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 Proyek M.A.T.A - Status Deployment: ${{ job.status }}
            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}
