name: M.A.T.A CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to Ubuntu VM via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Koneksi SSH Berhasil!"
            cd /var/www/html || mkdir -p /var/www/html
            git pull origin main || echo "Bukan repo git, lanjut..."
            sudo systemctl restart nginx
            echo "Deployment Selesai!"

      - name: Send Telegram Notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 Proyek M.A.T.A - Status Deployment: ${{ job.status }}
            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}
