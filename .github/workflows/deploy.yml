name: Deploy to Ubuntu VM & Notify Telegram

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Server via SSH
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USE }}@${{ secrets.SERVER_HOST }} "cd /path/ke/project/di/ubuntu && git pull && echo 'Deploy Berhasil!'"

      - name: Send Telegram Notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" == "success" ]; then
            MESSAGE="✅ *SUKSES!*\nDeployment M.A.T.A PBL ke Ubuntu Server berhasil dilakukan secara otomatis!"
          else
            MESSAGE="❌ *GAGAL!*\nDeployment M.A.T.A PBL mengalami error/gagal. Cek log GitHub Actions."
          fi
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MESSAGE" \
            -d "parse_mode=Markdown"
